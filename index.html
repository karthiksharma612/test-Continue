<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at top left, #0d74ff 0%, #023a9a 45%, #012568 100%);
        color: #ffffff;
        overflow: hidden;
      }
      .theme-toggle {
        position: fixed;
        top: 16px;
        right: 20px;
        padding: 8px 14px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(6px);
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        z-index: 10;
        letter-spacing: 0.05em;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      }
      .theme-toggle:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      .backdrop {
        position: absolute;
        inset: 8vh 8vw;
        border-radius: 36px;
        background: linear-gradient(145deg, rgba(7, 76, 200, 0.45), rgba(0, 32, 112, 0.6));
        box-shadow: 0 60px 120px rgba(1, 8, 32, 0.4);
      }

      .decor {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .blob {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6), rgba(0, 82, 255, 0));
        filter: blur(0px);
        opacity: 0.35;
      }

      .blob:nth-child(1) {
        top: 8%;
        left: 16%;
        transform: rotate(25deg);
      }

      .blob:nth-child(2) {
        top: 16%;
        right: 22%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle at 70% 30%, rgba(0, 255, 255, 0.6), rgba(0, 30, 112, 0));
      }

      .blob:nth-child(3) {
        bottom: 18%;
        left: 20%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.5), rgba(8, 32, 128, 0));
      }

      .blob:nth-child(4) {
        bottom: 12%;
        right: 15%;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle at 40% 60%, rgba(0, 204, 255, 0.45), rgba(0, 25, 90, 0));
      }

      .swirl {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 28px solid rgba(255, 255, 255, 0.14);
        border-right-color: transparent;
        border-bottom-color: transparent;
        transform: rotate(30deg);
        filter: blur(1px);
      }

      .swirl:nth-child(5) {
        top: 12%;
        right: 30%;
      }

      .swirl:nth-child(6) {
        bottom: 8%;
        left: 10%;
        width: 220px;
        height: 220px;
        transform: rotate(-42deg);
      }

      .login-card {
        position: relative;
        width: min(360px, 90vw);
        padding: 48px 44px 40px;
        border-radius: 28px;
        background: linear-gradient(170deg, rgba(16, 90, 235, 0.88), rgba(3, 42, 140, 0.72));
        box-shadow: 0 28px 60px rgba(0, 20, 68, 0.45);
        backdrop-filter: blur(14px);
        z-index: 2;
      }

      .login-card h1 {
        text-align: center;
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        margin: 0 0 28px;
      }

      .login-card h2 {
        font-size: 1.5rem;
        margin: 0 0 18px;
        font-weight: 600;
      }

      label {
        display: block;
        font-size: 0.78rem;
        font-weight: 500;
        margin-bottom: 6px;
      }

      .input-field {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.9);
        color: #1a2e55;
        font-size: 0.86rem;
        transition: box-shadow 0.2s ease;
      }

      .input-field::placeholder {
        color: rgba(26, 46, 85, 0.55);
      }

      .input-field:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
      }

      .form-row {
        margin-bottom: 18px;
      }

      .forgot {
        display: inline-block;
        margin-bottom: 28px;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .forgot:hover {
        color: #ffffff;
      }

      .primary-button {
        width: 100%;
        padding: 14px 18px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #012d7b, #021d57);
        color: #ffffff;
        font-size: 0.96rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(0, 22, 78, 0.45);
      }

      .divider {
        text-align: center;
        margin: 24px 0 18px;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.7);
      }

      .social-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 26px;
      }

      .social-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 0;
        border-radius: 12px;
        border: none;
        background: rgba(255, 255, 255, 0.92);
        color: #1b2d4f;
        font-weight: 500;
        font-size: 0.75rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .social-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 20px rgba(6, 32, 120, 0.3);
      }

      .social-icon {
        width: 18px;
        height: 18px;
      }

      .footer-note {
        text-align: center;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .footer-note a {
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }

      @media (max-width: 768px) {
        .backdrop {
          inset: 6vh 6vw;
        }

        .login-card {
          padding: 44px 32px 36px;
        }
      }

      /* Light theme overrides */
      body[data-theme="light"] {
        background: radial-gradient(circle at top left, #ffffff 0%, #e6f1ff 45%, #d2e6ff 100%);
        color: #1c355e;
      }
      body[data-theme="light"] .backdrop {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(210, 230, 255, 0.75));
        box-shadow: 0 60px 120px rgba(120, 150, 180, 0.35);
      }
      body[data-theme="light"] .blob {
        background: radial-gradient(circle at 30% 30%, rgba(120, 170, 255, 0.55), rgba(140, 180, 255, 0));
        opacity: 0.3;
        filter: blur(2px);
      }
      body[data-theme="light"] .login-card {
        background: linear-gradient(170deg, rgba(255, 255, 255, 0.95), rgba(236, 243, 255, 0.9));
        box-shadow: 0 20px 48px rgba(160, 185, 210, 0.45);
        color: #1c355e;
      }
      body[data-theme="light"] .login-card h1,
      body[data-theme="light"] .login-card h2 { color: #1c355e; }
      body[data-theme="light"] .input-field {
        background: #ffffff;
        color: #1c355e;
        box-shadow: 0 0 0 1px rgba(28, 53, 94, 0.08);
      }
      body[data-theme="light"] .input-field::placeholder {
        color: rgba(28, 53, 94, 0.55);
      }
      body[data-theme="light"] .forgot { color: rgba(28, 53, 94, 0.7); }
      body[data-theme="light"] .forgot:hover { color: #1c355e; }
      body[data-theme="light"] .primary-button {
        background: linear-gradient(135deg, #4d8dff, #1c5ed6);
        color: #ffffff;
      }
      body[data-theme="light"] .divider { color: rgba(28, 53, 94, 0.6); }
      body[data-theme="light"] .social-button {
        background: #ffffff;
        color: #1c355e;
        box-shadow: 0 6px 14px rgba(140, 180, 220, 0.25);
      }
      body[data-theme="light"] .social-button:hover {
        box-shadow: 0 10px 18px rgba(140, 180, 220, 0.35);
      }
      body[data-theme="light"] .footer-note { color: rgba(28, 53, 94, 0.65); }
      body[data-theme="light"] .footer-note a { color: #1c355e; }
      body[data-theme="light"] .theme-toggle {
        background: rgba(0, 60, 160, 0.08);
        color: #1c355e;
        border-color: rgba(0, 60, 160, 0.25);
      }
      body[data-theme="light"] .theme-toggle:hover {
        background: rgba(0, 60, 160, 0.15);
      }
    </style>
  </head>
  <body>
    <button id="themeToggle" type="button" class="theme-toggle" aria-label="Toggle light/dark theme">Light Theme</button>
    <div class="backdrop"></div>
    <div class="decor">
      <span class="blob"></span>
      <span class="blob"></span>
      <span class="blob"></span>
      <span class="blob"></span>
      <span class="swirl"></span>
      <span class="swirl"></span>
    </div>
    <main class="login-card">
      <h1>Your logo</h1>
      <h2>Login</h2>
      <form>
        <div class="form-row">
          <label for="email">Email</label>
          <input
            class="input-field"
            type="email"
            id="email"
            name="email"
            placeholder="username@gmail.com"
            required
          />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input
            class="input-field"
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>
        <a class="forgot" href="#">Forgot Password?</a>
        <button class="primary-button" type="submit">Sign in</button>
      </form>
      <p class="divider">or continue with</p>
      <div class="social-row">
        <button class="social-button" type="button">
          <img
            class="social-icon"
            src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3e%3cpath fill='%23FFC107' d='M43.611 20.083H42V20H24v8h11.303C33.407 32.91 29.057 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.051 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.651-.389-3.917z'/%3e%3cpath fill='%23FF3D00' d='M6.306 14.691l6.571 4.819C14.655 16.108 18.961 13 24 13c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.051 6.053 29.268 4 24 4c-7.794 0-14.426 4.416-17.694 10.691z'/%3e%3cpath fill='%234CAF50' d='M24 44c5.005 0 9.528-1.916 12.978-5.042l-6.004-4.997C29.149 35.861 26.715 36.999 24 37c-5.032 0-9.372-3.078-11.151-7.406l-6.522 5.024C9.531 39.556 16.227 44 24 44z'/%3e%3cpath fill='%232196F3' d='M43.611 20.083H42V20H24v8h11.303c-.996 3.065-3.147 5.662-5.83 7.293l.004-.003 6.004 4.997C33.789 41.131 39 44 45 44c7-8.936 7-21.064 0-30z'/%3e%3c/svg%3e"
            alt="Google"
          />
        </button>
        <button class="social-button" type="button">
          <img
            class="social-icon"
            src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3cpath fill='%23000000' d='M12 2C6.477 2 2 6.477 2 12a9.997 9.997 0 0 0 6.84 9.488c.5.09.682-.217.682-.482 0-.237-.009-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.607.069-.607 1.004.07 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.833.091-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.646 0 0 .84-.269 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.851.004 1.705.115 2.504.338 1.909-1.295 2.748-1.026 2.748-1.026.546 1.376.202 2.393.1 2.646.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.744 0 .267.18.576.688.478A10.001 10.001 0 0 0 22 12c0-5.523-4.477-10-10-10z'/%3e%3c/svg%3e"
            alt="GitHub"
          />
        </button>
        <button class="social-button" type="button">
          <img
            class="social-icon"
            src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3cpath fill='%230077F2' d='M21.5 0h-19A2.5 2.5 0 000 2.5v19A2.5 2.5 0 002.5 24h9.68v-9.294H9.847V11.53h2.333v-1.883c0-2.317 1.416-3.58 3.484-3.58.99 0 1.84.072 2.088.106v2.422h-1.432c-1.124 0-1.343.534-1.343 1.32v1.615h2.683l-.35 3.176h-2.333V24H21.5A2.5 2.5 0 0024 21.5v-19A2.5 2.5 0 0021.5 0z'/%3e%3c/svg%3e"
            alt="Facebook"
          />
        </button>
      </div>
      <p class="footer-note">
        Don’t have an account yet?
        <a href="#">Register for free</a>
      </p>
    </main>
    <script>
      (function() {
        const body = document.body;
        const toggle = document.getElementById('themeToggle');
        const saved = localStorage.getItem('theme');
        if (saved === 'light') {
          body.setAttribute('data-theme', 'light');
          toggle.textContent = 'Dark Theme';
        }
        toggle.addEventListener('click', () => {
          const isLight = body.getAttribute('data-theme') === 'light';
          if (isLight) {
            body.removeAttribute('data-theme');
            localStorage.setItem('theme', 'dark');
            toggle.textContent = 'Light Theme';
          } else {
            body.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            toggle.textContent = 'Dark Theme';
          }
        });
      })();
    </script>
  </body>
</html>
